name: NeoLoad Controller Project (zip) with User Data

on:
  workflow_dispatch:
    inputs:
      api_url:
        required: true
        description: 'NeoLoad Web Api Url'
        default: 'https://neoload-api.saas.neotys.com/'
      controller_zone_id:
        required: true
        description: 'Controller zone (must have 1 controller)'
        type: choice
        default: 'y1e48'
        options:
          - 'y1e48'
      lg_zone_1:
        required: true
        description: 'Load generator zone 1'
        type: choice
        default: 'y1e48'
        options:
          - 'y1e48'   # 1 Controller + 1 LG
          - '4L75K'   # 1 LG only
      lg_count_1:
        required: true
        description: 'Number of LGs in zone 1 (max 1)'
        default: '1'
      lg_zone_2:
        required: true
        description: 'Load generator zone 2'
        type: choice
        default: '4L75K'
        options:
          - '4L75K'   # 1 LG only
          - 'y1e48'   # 1 Controller + 1 LG
      lg_count_2:
        required: true
        description: 'Number of LGs in zone 2 (max 1)'
        default: '1'
      scenario:
        required: true
        description: 'Scenario name in the NeoLoad Controller project (10 users)'
        default: 'scenario1'
      vu_count:
        required: true
        description: 'Number of virtual users in the scenario (used to check the data file)'
        default: '10'

permissions:
  contents: read
  checks: write

env:
  API_URL: ${{ github.event.inputs.api_url }}
  CONTROLLER_ZONE_ID: ${{ github.event.inputs.controller_zone_id }}
  LG_ZONE_1: ${{ github.event.inputs.lg_zone_1 }}
  LG_COUNT_1: ${{ github.event.inputs.lg_count_1 }}
  LG_ZONE_2: ${{ github.event.inputs.lg_zone_2 }}
  LG_COUNT_2: ${{ github.event.inputs.lg_count_2 }}
  SCENARIO: ${{ github.event.inputs.scenario }}
  VU_COUNT: ${{ github.event.inputs.vu_count }}
  DATA_TARGET: data\users.csv
  MIN_ROWS: ${{ github.event.inputs.vu_count }}

jobs:
  neoload_nlp_zip:
    name: NeoLoad Controller project run (${{ github.event.inputs.vu_count }} VUs)
    runs-on: self-hosted
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Validate zone selection
        shell: powershell
        run: |
          if ($env:LG_ZONE_1 -eq $env:LG_ZONE_2) {
            throw "Pick two different LG zones. Each zone only has 1 load generator."
          }
          if ([int]$env:LG_COUNT_1 -gt 1 -or [int]$env:LG_COUNT_2 -gt 1) {
            throw "Each zone has only 1 load generator. Set the count to 1 (or 0)."
          }

      - name: Install NeoLoad CLI
        run: pip install -U neoload

      - name: Login to NeoLoad Web
        run: >-
          neoload login
          --url ${{ env.API_URL }}
          ${{ secrets.NEOLOAD_TOKEN }}

      - name: Prepare NeoLoad test
        run: >-
          neoload test-settings
          --zone ${{ env.CONTROLLER_ZONE_ID }}
          --lgs "${{ env.LG_ZONE_1 }}:${{ env.LG_COUNT_1 }},${{ env.LG_ZONE_2 }}:${{ env.LG_COUNT_2 }}"
          --scenario ${{ env.SCENARIO }}
          createorpatch "DemoWebShop NLP"

      - name: Prepare the project, add the user data and upload
        shell: powershell
        env:
          # Only the PATH is stored in the secret. The credentials stay in the file on your drive.
          DATA_SOURCE: ${{ secrets.NEOLOAD_DATA_PATH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATA_SOURCE)) { throw "Secret NEOLOAD_DATA_PATH is empty or missing" }
          if (-not (Test-Path -LiteralPath $env:DATA_SOURCE)) { throw "Data file not found at the path in secret NEOLOAD_DATA_PATH. Check the runner can reach it." }
          if (Test-Path nlp_project) { Remove-Item -Recurse -Force nlp_project }
          New-Item -ItemType Directory -Path nlp_project | Out-Null
          robocopy . nlp_project /E /XD .git .github nlp_project /NFL /NDL /NJH /NJS | Out-Null
          $nlp = Get-ChildItem -Path nlp_project -Filter *.nlp | Select-Object -First 1
          if (-not $nlp) { throw "No .nlp file found in the repository" }
          $dir = $nlp.DirectoryName
          Write-Host "Project file: $($nlp.Name)"
          $target = Join-Path $dir $env:DATA_TARGET
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          $lines = @(Get-Content -LiteralPath $env:DATA_SOURCE | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_ -replace "`t", "," })
          Set-Content -LiteralPath $target -Value $lines -Encoding ascii
          $rows = $lines.Count - 1
          Write-Host "Data rows copied: $rows (VUs: $env:VU_COUNT)"
          if ($rows -lt [int]$env:MIN_ROWS) { throw "Need at least $env:MIN_ROWS data rows for $env:VU_COUNT VUs, found $rows" }
          neoload project --path "$dir" upload
          if ($LASTEXITCODE -ne 0) { throw "neoload project upload failed" }

      - name: NeoLoad run test
        run: >-
          neoload run
          --external-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --external-url-label "Github Action Run ${{ github.run_number }}"
          --name "Demo Web Shop NLP - ${{ env.VU_COUNT }} VUs - Github build ${{ github.run_number }}"
          --description "Started from Github Actions (${{ env.VU_COUNT }} VUs, scenario ${{ env.SCENARIO }}, LGs ${{ env.LG_ZONE_1 }} + ${{ env.LG_ZONE_2 }})"

      - name: Generate Test Report
        id: report
        if: ${{ success() }}
        run: neoload test-results junitsla

      - name: Publish Test Report
        if: steps.report.outcome == 'success'
        uses: scacap/action-surefire-report@v1
        with:
          report_paths: junit-sla.xml
          fail_on_test_failures: true
          fail_if_no_tests: false

      # Remove the copy of the user data from the runner, even if a step failed
      - name: Clean up user data on the runner
        if: always()
        shell: powershell
        run: |
          if (Test-Path nlp_project) { Remove-Item -Recurse -Force nlp_project }
